name: Build Windows Portable ZIP

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Install Electron & electron-builder
        run: npm install --no-save electron electron-builder

      - name: Build Portable Windows EXE & ZIP
        run: npm run dist:win

      - name: Rename portable ZIP artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path release -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName -Destination "TestDisk-PhotoRec-Windows-Portable.zip"
          }

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TestDisk-PhotoRec-Windows-Portable
          path: |
            TestDisk-PhotoRec-Windows-Portable.zip
            release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TestDisk-PhotoRec-Windows-Portable.zip
            release/*.exe
