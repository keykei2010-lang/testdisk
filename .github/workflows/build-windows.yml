name: Build Windows Portable ZIP

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Run Type-check, ESLint & Unit Tests
        run: |
          npm run lint
          npx tsx --test tests/recoveryEngine.test.ts

      - name: Install Electron & electron-builder (Pinned)
        run: npm install --no-save electron@45.5.0 electron-builder@26.18.0

      - name: Download, Verify SHA-256 & Bundle Recovery Engines (Sleuth Kit, FFmpeg)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "electron/bin/sleuthkit", "electron/bin/ffmpeg", "$env:TEMP/td_engines" | Out-Null

          $tskUrl = "https://github.com/sleuthkit/sleuthkit/releases/download/sleuthkit-4.15.0/sleuthkit-4.15.0-win32.zip"
          $tskExpectedSha256 = "c2ebab8105b893d97bd8ce35b88e01985e2a106efc97f03adf95840a631b20ce"
          Write-Host "Downloading The Sleuth Kit 4.15.0..."
          $tskZip = "$env:TEMP/td_engines/tsk.zip"
          Invoke-WebRequest -Uri $tskUrl -OutFile $tskZip -UseBasicParsing
          $tskActualSha256 = (Get-FileHash -Path $tskZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tskActualSha256 -ne $tskExpectedSha256) {
            throw "Sleuth Kit SHA-256 mismatch! Expected $tskExpectedSha256, got $tskActualSha256"
          }
          Expand-Archive -Path $tskZip -DestinationPath "$env:TEMP/td_engines/tsk" -Force
          Get-ChildItem -Path "$env:TEMP/td_engines/tsk" -Recurse -File | Where-Object {
            $_.Name -in @("fls.exe", "icat.exe", "istat.exe", "mmls.exe") -or $_.Extension -eq ".dll"
          } | ForEach-Object { Copy-Item $_.FullName -Destination "electron/bin/sleuthkit/" -Force }

          $ffUrl = "https://github.com/GyanD/codexffmpeg/releases/download/9.1/ffmpeg-9.1-essentials_build.zip"
          $ffExpectedSha256 = "b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd"
          Write-Host "Downloading FFmpeg 9.1 Essentials Win64..."
          $ffZip = "$env:TEMP/td_engines/ffmpeg.zip"
          Invoke-WebRequest -Uri $ffUrl -OutFile $ffZip -UseBasicParsing
          $ffActualSha256 = (Get-FileHash -Path $ffZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ffActualSha256 -ne $ffExpectedSha256) {
            throw "FFmpeg SHA-256 mismatch! Expected $ffExpectedSha256, got $ffActualSha256"
          }
          Expand-Archive -Path $ffZip -DestinationPath "$env:TEMP/td_engines/ff" -Force
          Get-ChildItem -Path "$env:TEMP/td_engines/ff" -Recurse -File | Where-Object {
            $_.Name -in @("ffmpeg.exe", "ffprobe.exe")
          } | ForEach-Object { Copy-Item $_.FullName -Destination "electron/bin/ffmpeg/" -Force }

          Get-ChildItem -Path "electron/bin" -Recurse -File | Select-Object FullName, Length

      - name: Build Portable Windows EXE & ZIP
        run: npm run dist:win

      - name: Rename portable ZIP artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path release -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName -Destination "Disk-Partition-Recovery-Explorer-Windows-Portable.zip"
          }

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Disk-Partition-Recovery-Explorer-Windows-Portable
          path: |
            Disk-Partition-Recovery-Explorer-Windows-Portable.zip
            release/*.exe
          if-no-files-found: error

      - name: Move dev-build tag to current commit
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-build ${{ github.sha }}
          git push -f origin refs/tags/dev-build

      - name: Update rolling dev-build pre-release (no manual release needed)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Latest Dev Build (Auto-Updated)
          body: |
            Automatically rebuilt from commit `${{ github.sha }}` (`${{ github.ref_name }}`).
            Bookmark this page or direct ZIP link to always download the newest test build without creating new releases.
          prerelease: true
          make_latest: false
          files: |
            Disk-Partition-Recovery-Explorer-Windows-Portable.zip
            release/*.exe

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Disk-Partition-Recovery-Explorer-Windows-Portable.zip
            release/*.exe
