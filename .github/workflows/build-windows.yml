name: Build Windows Portable ZIP

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Install Electron & electron-builder
        run: npm install --no-save electron electron-builder

      - name: Download & Bundle Recovery Engines (Sleuth Kit, TestDisk/PhotoRec, FFmpeg)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path "electron/bin/sleuthkit", "electron/bin/testdisk", "electron/bin/ffmpeg", "$env:TEMP/td_engines" | Out-Null

          try {
            Write-Host "Downloading The Sleuth Kit 4.15.0..."
            $tskZip = "$env:TEMP/td_engines/tsk.zip"
            Invoke-WebRequest -Uri "https://github.com/sleuthkit/sleuthkit/releases/download/sleuthkit-4.15.0/sleuthkit-4.15.0-win32.zip" -OutFile $tskZip -UseBasicParsing
            Expand-Archive -Path $tskZip -DestinationPath "$env:TEMP/td_engines/tsk" -Force
            Get-ChildItem -Path "$env:TEMP/td_engines/tsk" -Recurse -File | Where-Object {
              $_.Name -in @("fls.exe", "icat.exe", "istat.exe", "mmls.exe") -or $_.Extension -eq ".dll"
            } | ForEach-Object { Copy-Item $_.FullName -Destination "electron/bin/sleuthkit/" -Force }
          } catch {
            Write-Warning "Sleuth Kit download skipped: $_"
          }

          try {
            Write-Host "Downloading CGSecurity TestDisk / PhotoRec 7.2 Win64..."
            $tdZip = "$env:TEMP/td_engines/testdisk.zip"
            Invoke-WebRequest -Uri "https://www.cgsecurity.org/testdisk-7.2.win64.zip" -OutFile $tdZip -UseBasicParsing
            Expand-Archive -Path $tdZip -DestinationPath "$env:TEMP/td_engines/td" -Force
            Get-ChildItem -Path "$env:TEMP/td_engines/td" -Recurse -File | Where-Object {
              $_.Name -in @("photorec_win.exe", "testdisk_win.exe", "fidentify_win.exe") -or $_.Extension -eq ".dll"
            } | ForEach-Object { Copy-Item $_.FullName -Destination "electron/bin/testdisk/" -Force }
          } catch {
            Write-Warning "TestDisk/PhotoRec download skipped: $_"
          }

          try {
            Write-Host "Downloading FFmpeg / FFprobe Win64..."
            $ffZip = "$env:TEMP/td_engines/ffmpeg.zip"
            Invoke-WebRequest -Uri "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffZip -UseBasicParsing
            Expand-Archive -Path $ffZip -DestinationPath "$env:TEMP/td_engines/ff" -Force
            Get-ChildItem -Path "$env:TEMP/td_engines/ff" -Recurse -File | Where-Object {
              $_.Name -in @("ffmpeg.exe", "ffprobe.exe")
            } | ForEach-Object { Copy-Item $_.FullName -Destination "electron/bin/ffmpeg/" -Force }
          } catch {
            Write-Warning "FFmpeg download skipped: $_"
          }

          Get-ChildItem -Path "electron/bin" -Recurse -File | Select-Object FullName, Length

      - name: Build Portable Windows EXE & ZIP
        run: npm run dist:win

      - name: Rename portable ZIP artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path release -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName -Destination "TestDisk-PhotoRec-Windows-Portable.zip"
          }

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TestDisk-PhotoRec-Windows-Portable
          path: |
            TestDisk-PhotoRec-Windows-Portable.zip
            release/*.exe
          if-no-files-found: error

      - name: Move dev-build tag to current commit
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-build ${{ github.sha }}
          git push -f origin refs/tags/dev-build

      - name: Update rolling dev-build pre-release (no manual release needed)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Latest Dev Build (Auto-Updated)
          body: |
            Automatically rebuilt from commit `${{ github.sha }}` (`${{ github.ref_name }}`).
            Bookmark this page or direct ZIP link to always download the newest test build without creating new releases.
          prerelease: true
          make_latest: false
          files: |
            TestDisk-PhotoRec-Windows-Portable.zip
            release/*.exe

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TestDisk-PhotoRec-Windows-Portable.zip
            release/*.exe
